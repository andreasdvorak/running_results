services:
    web:
        build: .
        ports:
            - "8000:8000"
        volumes:
            - ./logs:/app/logs
        depends_on:
            db:
                condition: service_healthy

    db:
        image: "postgres:18.6"
        ports:
            - "5432:5432"
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./db-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    # database administration
    adminer:
        image: adminer
        environment:
            ADMINER_DEFAULT_SERVER: db
        restart: always
        ports:
            - 8080:8080
        depends_on:
            - db
