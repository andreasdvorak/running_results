services:
    web:
        build: .
        ports:
            - "${WEB_PORT}:8000"
        volumes:
            - ./logs/${INSTANCE_NAME}:/app/logs
        depends_on:
            db:
                condition: service_healthy

    db:
        image: "postgres:18.6"
        ports:
            - "${DB_PORT}:5432"
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./db-data/${INSTANCE_NAME}:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    # database administration
    adminer:
        image: adminer
        environment:
            ADMINER_DEFAULT_SERVER: db
        restart: always
        ports:
            - "${ADMINER_PORT}:8080"
        depends_on:
            - db
